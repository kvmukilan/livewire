name: Website

on:
  push:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - ".github/workflows/website-pages.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - ".github/workflows/website-pages.yml"

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website (${{ matrix.layout.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        layout:
          - { name: root, base: '/' }
          - { name: github-pages, base: '/livewire/' }
    env:
      PUBLIC_SITE_URL: https://kvmukilan.github.io
      PUBLIC_BASE_PATH: ${{ matrix.layout.base }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: website-failure-${{ matrix.layout.name }}
          path: website/test-results/
          retention-days: 7
