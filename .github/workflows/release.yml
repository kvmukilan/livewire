name: Release

on:
  push:
    tags:
      - "v*"

env:
  GOTOOLCHAIN: local

permissions:
  contents: read

# Release binaries are never committed. A tag's dist/v<version>/ holds only
# SHA256SUMS and the SBOM. This workflow rebuilds every artifact, proves the
# rebuilt checksum manifest is byte-identical to the committed one, and only
# then publishes the rebuilt files.
jobs:
  qualification:
    name: Release qualification evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - name: Require qualification for stable tags
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Release candidate: field qualification remains pending."
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            go run ./scripts/qualify validate -version "$version" -artifacts "dist/v$version" qualification/stable.json
          else
            echo "Unsupported release tag" >&2
            exit 1
          fi

  compatibility:
    name: Release compatibility - Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.7", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - run: go mod verify
      - run: go run ./scripts/task build vet test dashboard corpus

  quality:
    name: Release security, race, fuzz, and coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - run: go run ./scripts/task lint race shuffle fuzz cover
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  release:
    name: Verify and publish release
    runs-on: windows-latest
    needs: [compatibility, quality, qualification]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-rc\.[1-9][0-9]*)?)$') {
            throw "Release tag must look like v1.2.3 or v1.2.3-rc.1; got $tag"
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Verify source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw "Module verification failed" }
          go run ./scripts/task test dashboard vet
          if ($LASTEXITCODE -ne 0) { throw "Windows verification failed" }
          go run ./scripts/task compare-releases -output "$env:RUNNER_TEMP/release-comparison"
          if ($LASTEXITCODE -ne 0) { throw "Published replay regression failed" }

      - name: Regenerate release artifacts
        shell: pwsh
        run: ./scripts/release.ps1 -Version "${{ steps.version.outputs.version }}" -OutputRoot "dist-verify"

      - name: Prove the rebuild matches the committed manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $committed = Get-Content "dist/v$version/SHA256SUMS" -Raw
          $rebuilt = Get-Content "dist-verify/v$version/SHA256SUMS" -Raw
          if ($committed -ne $rebuilt) {
            throw "Rebuilt artifacts differ from the committed checksum manifest:`n--- committed ---`n$committed`n--- rebuilt ---`n$rebuilt"
          }
          $committedBom = Get-Content "dist/v$version/livewire-$version.cdx.json" -Raw
          $rebuiltBom = Get-Content "dist-verify/v$version/livewire-$version.cdx.json" -Raw
          if ($committedBom -ne $rebuiltBom) { throw "Rebuilt SBOM differs from the committed SBOM" }
          foreach ($line in Get-Content "dist-verify/v$version/SHA256SUMS") {
            if ($line -notmatch '^(?<hash>[0-9a-f]{64})  (?<name>.+)$') { throw "Malformed checksum line: $line" }
            $actual = (Get-FileHash "dist-verify/v$version/$($Matches.name)" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches.hash) { throw "Rebuilt file does not match its own manifest: $($Matches.name)" }
          }

      - name: Validate SBOM and ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dir = "dist-verify/v$version"
          $bom = Get-Content "$dir/livewire-$version.cdx.json" -Raw | ConvertFrom-Json
          if ($bom.bomFormat -ne "CycloneDX" -or $bom.specVersion -ne "1.6" -or -not $bom.components) {
            throw "CycloneDX SBOM validation failed"
          }
          $zipDir = Join-Path $env:RUNNER_TEMP "zip-smoke"
          Expand-Archive "$dir/livewire-$version-windows-amd64.zip" $zipDir
          & "$zipDir/livewire.exe" version
          if ($LASTEXITCODE -ne 0) { throw "Windows ZIP smoke test failed" }

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)")
          if (-not $match.Success) { throw "No changelog section for $version" }
          [IO.File]::WriteAllText("release-notes.md", $match.Value.Trim() + "`n", [Text.UTF8Encoding]::new($false))

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: livewire-${{ steps.version.outputs.version }}
          path: dist-verify/v${{ steps.version.outputs.version }}/*
          if-no-files-found: error

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-verify/v${{ steps.version.outputs.version }}/livewire-${{ steps.version.outputs.version }}-linux-amd64
            dist-verify/v${{ steps.version.outputs.version }}/livewire-${{ steps.version.outputs.version }}-linux-arm64
            dist-verify/v${{ steps.version.outputs.version }}/livewire-${{ steps.version.outputs.version }}-windows-amd64.exe
            dist-verify/v${{ steps.version.outputs.version }}/livewire-${{ steps.version.outputs.version }}-windows-amd64.zip
            dist-verify/v${{ steps.version.outputs.version }}/livewire-${{ steps.version.outputs.version }}.cdx.json
            dist-verify/v${{ steps.version.outputs.version }}/SHA256SUMS

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $assets = Get-ChildItem "dist-verify/v$version" -File | Sort-Object Name | ForEach-Object FullName
          $releaseOptions = @()
          if ($version -match '-rc\.') { $releaseOptions = @('--prerelease', '--latest=false') }
          gh release create "${{ github.ref_name }}" @assets --verify-tag --title "Livewire ${{ github.ref_name }}" --notes-file release-notes.md @releaseOptions
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }

      - name: Verify published assets and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $download = Join-Path $env:RUNNER_TEMP "release-download"
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download "${{ github.ref_name }}" --dir $download
          $published = Get-ChildItem $download -File | Sort-Object Name
          $rebuilt = Get-ChildItem "dist-verify/v$version" -File | Sort-Object Name
          if (Compare-Object $rebuilt.Name $published.Name) { throw "Published asset list differs from rebuilt assets" }
          $committed = Get-Content "dist/v$version/SHA256SUMS" -Raw
          $downloaded = Get-Content (Join-Path $download "SHA256SUMS") -Raw
          if ($committed -ne $downloaded) { throw "Published checksum manifest differs from the committed one" }
          foreach ($line in Get-Content (Join-Path $download "SHA256SUMS")) {
            if ($line -notmatch '^(?<hash>[0-9a-f]{64})  (?<name>.+)$') { throw "Malformed checksum line: $line" }
            $actual = (Get-FileHash (Join-Path $download $Matches.name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches.hash) { throw "Published checksum mismatch for $($Matches.name)" }
          }
