name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  compatibility:
    name: Release compatibility - Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.14", "1.26.7", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - run: go mod verify
      - run: go test -count=1 ./...
      - run: go vet ./...

  quality:
    name: Release security, race, fuzz, and coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -severity high -confidence high -exclude-generated ./...
      - name: Race, shuffle, and repeat
        run: |
          go test -race -count=1 ./...
          go test -shuffle=on -count=3 ./...
          go test -shuffle=on -count=20 ./internal/webui
      - name: Fuzz smoke
        run: |
          go test ./internal/adapters -run='^$' -fuzz=FuzzBuiltInDecoders -fuzztime=5s -parallel=1
          go test ./internal/adapters -run='^$' -fuzz=FuzzRulePackCompiler -fuzztime=5s -parallel=1
          go test ./internal/lab -run='^$' -fuzz=FuzzScenarioParsing -fuzztime=5s -parallel=1
          go test ./internal/tlsreplay -run='^$' -fuzz=FuzzTLSRecordAndHandshakeParsing -fuzztime=5s -parallel=1
          go test ./internal/replay -run='^$' -fuzz=FuzzTraceExtractionCoverage -fuzztime=5s -parallel=1
          go test ./internal/ipreasm -run='^$' -fuzz=FuzzIPv6FragmentReassembly -fuzztime=5s -parallel=1
          go test ./internal/ipreasm -run='^$' -fuzz=FuzzMalformedFragmentFrames -fuzztime=5s -parallel=1
      - name: Coverage floors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          go test -coverprofile=coverage/aggregate.out ./...
          go test -coverprofile=coverage/pcapio.out ./internal/pcapio
          go test -coverprofile=coverage/webui.out ./internal/webui
          go test -coverprofile=coverage/cmd.out ./cmd/livewire
          go test -coverprofile=coverage/backend.out ./internal/backend
          check_floor() {
            local profile="$1" floor="$2" label="$3" actual
            actual="$(go tool cover -func="$profile" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
            printf '%s coverage: %s%% (required %s%%)\n' "$label" "$actual" "$floor"
            awk -v actual="$actual" -v floor="$floor" 'BEGIN { exit !(actual + 0 >= floor + 0) }'
          }
          check_floor coverage/aggregate.out 60 aggregate
          check_floor coverage/pcapio.out 85 pcapio
          check_floor coverage/webui.out 60 webui
          check_floor coverage/cmd.out 30 cmd/livewire
          check_floor coverage/backend.out 20 backend

  release:
    name: Verify and publish release
    runs-on: windows-latest
    needs: [compatibility, quality]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Release tag must look like v1.2.3; got $tag"
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Verify source
        shell: pwsh
        run: |
          go mod verify
          go test -count=1 ./...
          go vet ./...

      - name: Regenerate release artifacts
        shell: pwsh
        run: ./scripts/release.ps1 -Version "${{ steps.version.outputs.version }}" -OutputRoot "dist-verify"

      - name: Byte-compare committed artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $expected = (Resolve-Path "dist/v$version").Path
          $actual = (Resolve-Path "dist-verify/v$version").Path
          $expectedFiles = Get-ChildItem $expected -File | Sort-Object Name
          $actualFiles = Get-ChildItem $actual -File | Sort-Object Name
          $names = Compare-Object $expectedFiles.Name $actualFiles.Name
          if ($names) { throw "Artifact name mismatch: $($names | Out-String)" }
          $mismatches = @()
          foreach ($file in $expectedFiles) {
            $rebuilt = Join-Path $actual $file.Name
            $want = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            $got = (Get-FileHash $rebuilt -Algorithm SHA256).Hash
            if ($want -ne $got) {
              $mismatches += "$($file.Name): committed=$want regenerated=$got"
            }
          }
          if ($mismatches) {
            throw "Non-reproducible artifacts:`n$($mismatches -join "`n")"
          }

      - name: Validate SBOM and ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dir = "dist/v$version"
          $bom = Get-Content "$dir/livewire-$version.cdx.json" -Raw | ConvertFrom-Json
          if ($bom.bomFormat -ne "CycloneDX" -or $bom.specVersion -ne "1.6" -or -not $bom.components) {
            throw "CycloneDX SBOM validation failed"
          }
          $zipDir = Join-Path $env:RUNNER_TEMP "zip-smoke"
          Expand-Archive "$dir/livewire-$version-windows-amd64.zip" $zipDir
          & "$zipDir/livewire.exe" version
          if ($LASTEXITCODE -ne 0) { throw "Windows ZIP smoke test failed" }

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)")
          if (-not $match.Success) { throw "No changelog section for $version" }
          [IO.File]::WriteAllText("release-notes.md", $match.Value.Trim() + "`n", [Text.UTF8Encoding]::new($false))

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: livewire-${{ steps.version.outputs.version }}
          path: dist/v${{ steps.version.outputs.version }}/*
          if-no-files-found: error

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/v${{ steps.version.outputs.version }}/livewire-${{ steps.version.outputs.version }}-linux-amd64
            dist/v${{ steps.version.outputs.version }}/livewire-${{ steps.version.outputs.version }}-linux-arm64
            dist/v${{ steps.version.outputs.version }}/livewire-${{ steps.version.outputs.version }}-windows-amd64.exe
            dist/v${{ steps.version.outputs.version }}/livewire-${{ steps.version.outputs.version }}-windows-amd64.zip
            dist/v${{ steps.version.outputs.version }}/livewire-${{ steps.version.outputs.version }}.cdx.json
            dist/v${{ steps.version.outputs.version }}/SHA256SUMS

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $assets = Get-ChildItem "dist/v$version" -File | Sort-Object Name | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @assets --verify-tag --title "Livewire ${{ github.ref_name }}" --notes-file release-notes.md

      - name: Verify published assets and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $download = Join-Path $env:RUNNER_TEMP "release-download"
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download "${{ github.ref_name }}" --dir $download
          $published = Get-ChildItem $download -File | Sort-Object Name
          $committed = Get-ChildItem "dist/v$version" -File | Sort-Object Name
          if (Compare-Object $committed.Name $published.Name) { throw "Published asset list differs from committed assets" }
          foreach ($line in Get-Content (Join-Path $download "SHA256SUMS")) {
            if ($line -notmatch '^(?<hash>[0-9a-f]{64})  (?<name>.+)$') { throw "Malformed checksum line: $line" }
            $actual = (Get-FileHash (Join-Path $download $Matches.name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches.hash) { throw "Published checksum mismatch for $($Matches.name)" }
          }
